<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Left Pillar: Blue Figure -->
    <linearGradient id="fav-pillar-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Right Pillar: Purple Figure -->
    <linearGradient id="fav-pillar-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Flow Ribbon -->
    <linearGradient id="fav-flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect width="100" height="100" rx="26" fill="url(#fav-bg)" />
  <rect width="100" height="100" rx="26" stroke="#4338ca" stroke-opacity="0.4" stroke-width="2" />

  <!-- Left Figure (Candidate) -->
  <circle cx="27" cy="20" r="8" fill="url(#fav-pillar-blue)" />
  <rect x="19" y="34" width="16" height="50" rx="8" fill="url(#fav-pillar-blue)" />

  <!-- Right Figure (Recruiter) -->
  <circle cx="73" cy="20" r="8" fill="url(#fav-pillar-purple)" />
  <rect x="65" y="34" width="16" height="50" rx="8" fill="url(#fav-pillar-purple)" />

  <!-- Ascending Flow Ribbon -->
  <path d="M 17 82 C 17 68 25 56 46 54 C 60 52 70 42 82 28"
        stroke="url(#fav-flow)" stroke-width="11" stroke-linecap="round" />

  <!-- Arrowhead (↗) -->
  <path d="M 91 19 L 89 36 L 82 30 L 73 24 Z" fill="#c084fc" />
</svg>